<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>谢思平 · 个人简历</title>
    <style>
        :root {
            --bg: #f7f5f0;
            --bg-soft: #fffcf8;
            --surface: #ffffff;
            --surface-2: #f1ede7;
            --text: #1e1b16;
            --text-soft: #4a443c;
            --text-faint: #6b6256;
            --primary: #9b5c3f;
            --primary-strong: #7a442c;
            --accent: #b48b5a;
            --accent-soft: #e7d9c5;
            --line: rgba(30, 27, 22, 0.1);
            --shadow: 0 12px 28px -12px rgba(30, 27, 22, 0.14), 0 4px 12px rgba(30, 27, 22, 0.04);
            --shadow-hover: 0 24px 40px -16px rgba(30, 27, 22, 0.22), 0 8px 18px rgba(30, 27, 22, 0.06);
            --radius: 20px;
            --radius-sm: 12px;
            --gradient: linear-gradient(145deg, #fffcf8 0%, #f3ede4 100%);
            --gradient-hero: radial-gradient(circle at 15% 20%, #f9efe6 0%, #f5ede2 45%, #e9dfd1 100%);
            --tag-bg: #efe5d7;
            --header-bg: rgba(247, 245, 240, 0.86);
            --nav-blur: blur(18px);
            --transition: 200ms cubic-bezier(0.2, 0, 0, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
            --focus-ring: 0 0 0 3px rgba(155, 92, 63, 0.35);
        }

        [data-theme="dark"] {
            --bg: #191714;
            --bg-soft: #211e1a;
            --surface: #221f1b;
            --surface-2: #2c2823;
            --text: #eae4dc;
            --text-soft: #cfc6ba;
            --text-faint: #a99f91;
            --primary: #c98b66;
            --primary-strong: #e0a884;
            --accent: #d4b28c;
            --accent-soft: #4d3f31;
            --line: rgba(235, 228, 218, 0.1);
            --shadow: 0 16px 32px -16px rgba(0, 0, 0, 0.5), 0 6px 16px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 28px 48px -20px rgba(0, 0, 0, 0.7), 0 12px 24px rgba(0, 0, 0, 0.4);
            --gradient: linear-gradient(145deg, #292520 0%, #1e1a16 100%);
            --gradient-hero: radial-gradient(circle at 20% 15%, #332b24 0%, #211d18 60%, #181512 100%);
            --tag-bg: #3a3028;
            --header-bg: rgba(25, 23, 20, 0.88);
            --focus-ring: 0 0 0 3px rgba(201, 139, 102, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            line-height: 1.6;
            font-size: 15px;
            letter-spacing: 0.015em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        :focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: 8px;
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: var(--nav-blur);
            -webkit-backdrop-filter: var(--nav-blur);
            border-bottom: 1px solid var(--line);
            transition: background var(--transition), border var(--transition);
        }

        .nav-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.02em;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-brand .avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-soft);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            background: var(--surface);
            flex-shrink: 0;
        }

        .nav-brand span {
            background: var(--primary);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-wrap: wrap;
            overflow-x: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-soft);
            font-weight: 500;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 30px;
            transition: background var(--transition), color var(--transition);
            white-space: nowrap;
        }

        .nav-links a:hover {
            background: var(--accent-soft);
            color: var(--primary-strong);
        }

        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-soft);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background var(--transition), border var(--transition), box-shadow var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            white-space: nowrap;
        }

        .icon-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            box-shadow: var(--shadow);
        }

        /* 移动端汉堡菜单按钮 */
        .menu-toggle {
            display: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 40px;
            padding: 8px 12px;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text);
            transition: background var(--transition);
        }

        .menu-toggle:hover {
            background: var(--accent-soft);
        }

        /* hero 区域 */
        .hero {
            padding: 140px 0 48px;
            background: var(--gradient-hero);
            border-bottom: 1px solid var(--line);
            transition: background var(--transition);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
        }

        .hero-title {
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }

        .hero-sub {
            font-size: 1.2rem;
            color: var(--text-soft);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .hero-desc {
            font-size: 1rem;
            color: var(--text-soft);
            max-width: 540px;
            margin-bottom: 24px;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
        }

        .badge {
            background: var(--tag-bg);
            color: var(--primary-strong);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            border: 1px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .badge:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .contact-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background var(--transition), box-shadow var(--transition);
            box-shadow: 0 8px 18px -8px var(--primary-strong);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: var(--primary-strong);
            box-shadow: 0 16px 24px -10px var(--primary-strong);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--line);
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-soft);
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-outline:hover {
            background: var(--surface);
            border-color: var(--accent);
            color: var(--primary);
        }

        /* 通用 section */
        .section {
            padding: 56px 0;
            border-bottom: 1px solid var(--line);
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: "";
            width: 6px;
            height: 28px;
            background: var(--primary);
            border-radius: 6px;
            flex-shrink: 0;
        }

        /* 卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--line);
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
            animation: fadeInUp 0.4s ease both;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .card h3 {
            font-size: 1.2rem;
            font-weight: 650;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--text-soft);
            font-size: 0.9rem;
        }

        /* 高亮成果 */
        .highlight-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .highlight-item {
            display: flex;
            align-items: baseline;
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--accent);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .highlight-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .highlight-num {
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--primary);
            margin-right: 16px;
            min-width: 60px;
            flex-shrink: 0;
        }

        /* Tabs */
        .tabs-container {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 8px;
            border: 1px solid var(--line);
        }

        .tab-list {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--line);
            padding-bottom: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 18px;
            font-weight: 500;
            color: var(--text-faint);
            cursor: pointer;
            border-radius: 30px;
            font-size: 0.9rem;
            transition: all var(--transition);
            white-space: nowrap;
            font-family: var(--font);
        }

        .tab-btn[aria-selected="true"] {
            background: var(--accent-soft);
            color: var(--primary-strong);
            font-weight: 650;
        }

        .tab-btn:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .tab-panel {
            display: none;
            padding: 10px 6px;
            animation: fadeIn 0.2s ease;
        }

        .tab-panel.active {
            display: block;
        }

        .timeline-item {
            padding: 0 0 18px 20px;
            border-left: 2px solid var(--accent);
            position: relative;
            margin-bottom: 12px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -7px;
            top: 6px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid var(--bg);
        }

        .timeline-item h3 {
            font-size: 1.1rem;
            font-weight: 650;
            margin-bottom: 4px;
        }

        .timeline-item ul {
            padding-left: 18px;
            color: var(--text-soft);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .timeline-item ul li {
            margin-bottom: 4px;
        }

        /* 技能矩阵 */
        .skill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        .skill-category {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--line);
        }

        .skill-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
            gap: 8px;
        }

        .skill-bar strong {
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .skill-bar span {
            font-size: 0.8rem;
            color: var(--text-faint);
        }

        .progress-bg {
            height: 7px;
            background: var(--surface-2);
            border-radius: 10px;
            flex: 1;
            margin-left: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .skill-desc {
            font-size: 0.8rem;
            color: var(--text-soft);
            margin-top: 6px;
        }

        .footer {
            text-align: center;
            padding: 32px 0;
            color: var(--text-faint);
            font-size: 0.85rem;
            border-top: 1px solid var(--line);
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.4rem;
            box-shadow: var(--shadow-hover);
            transition: opacity var(--transition), transform var(--transition), background var(--transition);
            opacity: 0;
            pointer-events: none;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-to-top.show {
            opacity: 1;
            pointer-events: auto;
        }

        .back-to-top:hover {
            background: var(--primary-strong);
        }

        /* 新增图片展示区 */
        .media-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin: 32px 0 8px;
        }

        .media-card {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--line);
            transition: transform var(--transition), box-shadow var(--transition);
            text-align: center;
        }

        .media-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .media-card img {
            width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: cover;
            border-radius: 8px;
            background: var(--bg-soft);
        }

        .media-card .caption {
            margin-top: 10px;
            font-weight: 500;
            color: var(--text-soft);
            font-size: 0.9rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            html {
                scroll-behavior: auto;
            }
            .progress-fill {
                transition: none;
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .hero-grid {
                grid-template-columns: 1fr;
                gap: 24px;
                padding-top: 16px;
            }

            .hero-title {
                font-size: 2.1rem;
            }

            .hero-sub {
                font-size: 1rem;
            }

            .nav-inner {
                padding: 8px 16px;
                gap: 8px;
            }

            .nav-links {
                display: none;
                width: 100%;
                order: 3;
                flex-direction: column;
                align-items: stretch;
                gap: 2px;
                background: var(--surface);
                border-radius: var(--radius-sm);
                padding: 8px;
                border: 1px solid var(--line);
                box-shadow: var(--shadow);
            }

            .nav-links.open {
                display: flex;
            }

            .nav-links a {
                padding: 10px 16px;
                border-radius: 8px;
                text-align: left;
            }

            .menu-toggle {
                display: inline-flex;
            }

            .section {
                padding: 40px 0;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .skill-grid {
                grid-template-columns: 1fr;
            }

            .highlight-item {
                padding: 14px 16px;
            }

            .highlight-num {
                font-size: 1.4rem;
                min-width: 40px;
            }

            .contact-row {
                gap: 8px;
            }

            .btn-primary,
            .btn-outline {
                padding: 8px 16px;
                font-size: 0.85rem;
            }

            .media-gallery {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
            }

            .hero {
                padding: 120px 0 32px;
            }

            .hero-title {
                font-size: 1.8rem;
            }

            .badge {
                font-size: 0.75rem;
                padding: 5px 10px;
            }

            .timeline-item {
                padding-left: 16px;
            }
        }

        /* 打印样式 */
        @media print {
            @page {
                margin: 1.5cm;
                size: A4;
            }

            body {
                background: #fff !important;
                color: #000 !important;
                font-size: 12px !important;
                line-height: 1.5 !important;
            }

            .navbar,
            .back-to-top,
            .btn-primary,
            .btn-outline,
            .icon-btn,
            .nav-actions,
            .menu-toggle,
            .contact-row .btn-outline,
            .contact-row .btn-primary {
                display: none !important;
            }

            .hero {
                padding: 20px 0 !important;
                background: none !important;
                border-bottom: 2px solid #333 !important;
            }

            .hero-grid {
                grid-template-columns: 1fr !important;
                gap: 12px !important;
            }

            .hero-title {
                font-size: 1.8rem !important;
                color: #000 !important;
            }

            .hero-sub,
            .hero-desc {
                color: #333 !important;
            }

            .section {
                padding: 16px 0 !important;
                border-bottom: 1px solid #ccc !important;
                break-inside: avoid;
            }

            .section-title {
                font-size: 1.4rem !important;
                color: #000 !important;
                margin-bottom: 12px !important;
            }

            .section-title::before {
                background: #333 !important;
            }

            .card,
            .highlight-item,
            .tabs-container,
            .skill-category {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                background: #fff !important;
                break-inside: avoid;
                animation: none !important;
                transition: none !important;
            }

            .card:hover,
            .highlight-item:hover {
                transform: none !important;
                box-shadow: none !important;
            }

            .tabs-container {
                padding: 8px !important;
            }

            .tab-list {
                border-bottom: 1px solid #ccc !important;
                margin-bottom: 8px !important;
                padding-bottom: 4px !important;
            }

            .tab-btn[aria-selected="true"] {
                background: #ddd !important;
                color: #000 !important;
            }

            .tab-panel {
                display: block !important;
                opacity: 1 !important;
                padding: 8px 0 !important;
                animation: none !important;
            }

            .tab-panel:not(.active) {
                display: none !important;
            }

            .tab-panel.active {
                display: block !important;
            }

            .timeline-item {
                border-left-color: #333 !important;
                margin-bottom: 8px !important;
                padding-left: 16px !important;
            }

            .timeline-item::before {
                background: #333 !important;
                border-color: #fff !important;
            }

            .highlight-num {
                color: #333 !important;
            }

            .progress-bg {
                background: #eee !important;
            }

            .progress-fill {
                background: #333 !important;
            }

            .badge {
                background: #eee !important;
                color: #333 !important;
                border: 1px solid #ccc !important;
            }

            .footer {
                border-top: 1px solid #ccc !important;
                color: #333 !important;
                padding: 16px 0 !important;
            }

            a[href^="tel:"] {
                color: #333 !important;
                text-decoration: none !important;
            }

            .contact-row {
                gap: 8px !important;
            }

            .media-gallery {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <header class="navbar" id="navbar">

            // Tab 切换逻辑 (ARIA + 键盘)
            function setupTabs(tabsContainerId) {
                const container = document.getElementById(tabsContainerId);
                const tablist = container.querySelector('[role="tablist"]');
                const tabs = Array.from(tablist.querySelectorAll('[role="tab"]'));
                const panels = Array.from(container.querySelectorAll('[role="tabpanel"]'));

                function selectTab(tab, focusTab = true) {
                    tabs.forEach((t, i) => {
                        const isSelected = t === tab;
                        t.setAttribute('aria-selected', isSelected ? 'true' : 'false');
                        t.setAttribute('tabindex', isSelected ? '0' : '-1');
                    });

                    panels.forEach(p => {
                        const panelId = p.id;
                        const tabId = tab.getAttribute('aria-controls');
                        if (panelId === tabId) {
                            p.classList.add('active');
                        } else {
                            p.classList.remove('active');
                        }
                    });

                    if (focusTab) {
                        tab.focus();
                    }
                }

                tabs.forEach((tab, index) => {
                    tab.addEventListener('click', () => selectTab(tab));
                    tab.addEventListener('keydown', (e) => {
                        let newIndex = null;
                        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                            e.preventDefault();
                            newIndex = (index + 1) % tabs.length;
                        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                            e.preventDefault();
                            newIndex = (index - 1 + tabs.length) % tabs.length;
                        } else if (e.key === 'Home') {
                            e.preventDefault();
                            newIndex = 0;
                        } else if (e.key === 'End') {
                            e.preventDefault();
                            newIndex = tabs.length - 1;
                        }

                        if (newIndex !== null) {
                            selectTab(tabs[newIndex], true);
                        }
                    });
                });

                // 默认选中第一个
                if (tabs.length > 0) {
                    selectTab(tabs[0], false);
                }
            }

            // 主题切换
            function initThemeToggle() {
                const toggleBtn = document.getElementById('themeToggle');
                const themeLabel = toggleBtn.querySelector('.theme-label');

                function getPreferredTheme() {
                    const stored = localStorage.getItem('theme');
                    if (stored === 'light' || stored === 'dark') {
                        return stored;
                    }
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }

                function applyTheme(theme) {
                    document.documentElement.setAttribute('data-theme', theme);
                    if (themeLabel) {
                        themeLabel.textContent = theme === 'dark' ? '浅色' : '深色';
                    }
                }

                const initialTheme = getPreferredTheme();
                applyTheme(initialTheme);

                toggleBtn.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    applyTheme(next);
                    localStorage.setItem('theme', next);
                });

                // 监听系统主题变化
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (!localStorage.getItem('theme')) {
                        applyTheme(e.matches ? 'dark' : 'light');
                    }
                });
            }

                btn.addEventListener('click', async () => {

                        } else {

                            const textarea = document.createElement('textarea');

                            textarea.style.opacity = '0';

            // 移动端菜单切换

                    const isOpen = navLinks.classList.toggle('open');
                    menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                    menuToggle.textContent = isOpen ? '✕' : '☰';
                });

                // 点击导航链接后关闭菜单
                navLinks.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        if (window.innerWidth <= 768) {
                            navLinks.classList.remove('open');
                            menuToggle.setAttribute('aria-expanded', 'false');
                            menuToggle.textContent = '☰';
                        }
                    });
                });

                // 点击页面其他地方关闭菜单
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768) {
                        if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
                            navLinks.classList.remove('open');
                            menuToggle.setAttribute('aria-expanded', 'false');
                            menuToggle.textContent = '☰';
                        }
                    }
                });

                // 窗口大小变化时重置
                window.addEventListener('resize', () => {
                    if (window.innerWidth > 768) {
                        navLinks.classList.remove('open');
                        menuToggle.setAttribute('aria-expanded', 'false');
                        menuToggle.textContent = '☰';
                    }
                });
            }

            // 进度条动画（使用 IntersectionObserver）
            function initProgressAnimation() {
                const progressFills = document.querySelectorAll('.progress-fill');

                if ('IntersectionObserver' in window) {
                    const observer = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                const fill = entry.target;
                                const width = fill.getAttribute('data-width');
                                fill.style.width = width + '%';
                                observer.unobserve(fill);
                            }
                        });
                    }, { threshold: 0.3 });

                    progressFills.forEach(fill => {
                        observer.observe(fill);
                    });
                } else {
                    // 降级方案
                    progressFills.forEach(fill => {
                        const width = fill.getAttribute('data-width');
                        fill.style.width = width + '%';
                    });
                }
            }

            // 平滑滚动（兼容性处理）
            function initSmoothScroll() {
                document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function(e) {
                        const targetId = this.getAttribute('href');
                        if (targetId === '#') return;

                        const targetElement = document.querySelector(targetId);
                        if (targetElement) {
                            e.preventDefault();
                            const navHeight = document.querySelector('.navbar').offsetHeight;
                            const targetPosition = targetElement.getBoundingClientRect().top + window.pageYOffset - navHeight;

                            window.scrollTo({
                                top: targetPosition,
                                behavior: 'smooth'
                            });
                        }
                    });
                });
            }

                initEmailCopy();
                initBackToTop();
                initMobileMenu();
                initProgressAnimation();
                initSmoothScroll();
            }

            // DOM 就绪后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
